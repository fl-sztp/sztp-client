name: ${SZTP_DHCP_PROJECT:?Run integration/run.sh to set the project name}

x-runtime: &runtime
  image: ${SZTP_DHCP_IMAGE:?Run integration/run.sh to set the image name}
  platform: linux/amd64
  cap_add:
    - NET_RAW
    - NET_BIND_SERVICE
    - NET_ADMIN
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "0"
    net.ipv6.conf.default.disable_ipv6: "0"
    net.ipv6.conf.all.accept_ra: "0"
    net.ipv6.conf.default.accept_ra: "0"

services:
  fixture:
    <<: *runtime
    build:
      context: ${SZTP_DHCP_REPOSITORY:?Run integration/run.sh to set the repository path}
      dockerfile: docker-tests/integration/Dockerfile
    command: [fixture]
    networks:
      dhcp:
        aliases: [bootstrap]
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.accept_ra=0
    healthcheck:
      test: [CMD, /usr/local/bin/dhcp-fixture, --healthcheck]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 1s

  tester:
    <<: *runtime
    command: [tester]
    environment:
      DHCP_FIXTURE_URL: http://fixture:8081
    volumes:
      - type: bind
        source: ${SZTP_DHCP_ARTIFACTS:?Run integration/run.sh to set the artifact directory}
        target: /artifacts
    networks:
      dhcp:
        driver_opts:
          com.docker.network.endpoint.sysctls: net.ipv6.conf.IFNAME.accept_ra=0
    depends_on:
      fixture:
        condition: service_healthy

networks:
  dhcp:
    driver: bridge
    # Docker's internal IPv4 bridge filter drops real 0.0.0.0-to-broadcast
    # DHCP packets. Disable NAT and remove both container default routes.
    internal: false
    enable_ipv6: true
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
