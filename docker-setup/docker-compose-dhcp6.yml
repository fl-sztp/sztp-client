services:
  dhcpd:
    image: docker.io/networkboot/dhcpd:1.3.0
    volumes:
      - ./dhcp:/opt
    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
    networks:
      - fl-sztp_network_ipv6
    command: >
      sh -e -u -x -c 'touch /var/lib/dhcp/dhcpd6.leases &&
                      cp /opt/dhcpd6.conf.template /etc/dhcp/dhcpd.conf &&
                      dhcpd -6 -d eth0'

  device-1:
    container_name: device-1
    networks:
      - fl-sztp_network_ipv6
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_BIND_SERVICE
    build:
      context: ../
      dockerfile: docker-setup/Dockerfile
    command: sh -c "apt-get update && apt-get install -y iproute2 && /usr/local/bin/fl-sztp-client --debug --insecure --serial first-serial-number --private-key /app/certs/first_private_key.pem --end-entity-cert /app/certs/first_my_cert.pem --trust-anchor-cert /app/certs/opi.pem && bash"
    depends_on:
      - dhcpd

networks:
  fl-sztp_network_ipv6:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "2001:db8:1::/64"
          gateway: "2001:db8:1::1"
