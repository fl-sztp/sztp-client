services:
  dhcpd:
    image: docker.io/networkboot/dhcpd:1.3.0
    environment:
      NODE_IP_SUBNET: 10.127.1.0
      NODE_IP_NETMASK: 255.255.255.0
      NODE_IP_RANGE_MIN: 10.127.1.100
      NODE_IP_RANGE_MAX: 10.127.1.253
      NODE_IP_ADDRESS: 10.127.1.99
    volumes:
      - ./dhcp:/opt
    cap_add:
      - CAP_NET_BIND_SERVICE
      - CAP_NET_RAW
    # ports:
    #   - 67:67/udp
    networks:
      - fl-sztp_network
    command: sh -e -u -x -c 'touch /var/lib/dhcp/dhcpd.leases && eval "echo \"$$(cat /opt/dhcpd4.conf.template)\"" > /etc/dhcp/dhcpd.conf && dhcpd -d'

  nmap:
    image: docker.io/instrumentisto/nmap:7.94
    networks:
      - fl-sztp_network
    command: --script broadcast-dhcp-discover

  nmap-scan:
    image: instrumentisto/nmap:latest
    networks:
      - fl-sztp_network
    command: nmap -sT 10.127.1.0/24 -p 8080,9090 --open # Scan open TCP ports on the 'ubuntu' container

  device-1:
    container_name: device-1
    build:
      context: ../ # This context points to the root where your Go code is located
      dockerfile: docker-setup/Dockerfile # Dockerfile is in docker-setup
    networks:
      - fl-sztp_network
    cap_add:
      - CAP_NET_ADMIN
    command: sh -c "ls -l /root/ && \ ls -l /usr/local/bin/ && \ /usr/local/bin/fl-sztp-client --debug --insecure --serial first-serial-number --private-key /app/certs/first_private_key.pem --end-entity-cert /app/certs/first_my_cert.pem --trust-anchor-cert /app/certs/opi.pem && \ bash"
    depends_on:
      - dhcpd

networks:
  fl-sztp_network:
    ipam:
      config:
        - subnet: "10.127.1.0/24"
          gateway: "10.127.1.1"
