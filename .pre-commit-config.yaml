# Routine declarative tool configuration. No original expressive content identified.

repos:
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
        always_run: true
        pass_filenames: false
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
        always_run: true
        pass_filenames: false
